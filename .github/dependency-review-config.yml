# Dependency Review Configuration
# https://github.com/actions/dependency-review-action#configuration-options

# Severity thresholds
fail-on-severity: high

# Allow specific vulnerable packages with justification
allow:
  # bcryptjs - used for password hashing, no known exploitable vulns in our usage
  # GHSA-xxxx: Medium severity, not exploitable without specific conditions
  # - GHSA-xxxx

# Ignore specific scopes
ignore:
  - devDependencies  # Dev deps don't ship to production

# Licenses that are not allowed
deny-licenses:
  - GPL-3.0-only
  - AGPL-3.0-only
  - SSPL-1.0

# Allow these licenses explicitly
# private-packages:
#   - @your-org/*