name: CI - Açaí Wave

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'

# Cancela runs antigos do mesmo ref (economiza minutos de CI)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissões mínimas por padrão (menor privilégio)
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  ELECTRON_VERSION: '32.3.3'

jobs:
  # ──────────────────────────────────────────────────────────────────
  # LINT & TYPECHECK
  # ──────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

  # ──────────────────────────────────────────────────────────────────
  # TESTS ON NODE.JS - Vitest suite + coverage
  # ──────────────────────────────────────────────────────────────────
  test-node:
    name: Tests on Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      # Instala os bindings dual-ABI (Node + Electron) e sincroniza o
      # binário padrão com o build Node, de forma determinística.
      - name: Install native bindings
        run: npm run rebuild:node

      - name: Verify Node.js ABI compatibility
        run: npm run check:node

      # --coverage gera ./coverage/lcov.info para o upload abaixo
      - name: Run test suite with coverage
        run: npm test -- --coverage --reporter=verbose

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: node-tests
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────────
  # ELECTRON ABI CHECK - native module loads under Electron ABI 128
  # ──────────────────────────────────────────────────────────────────
  test-electron:
    name: Electron ABI Check (ABI 128)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Electron native binding
        run: npm run rebuild:native

      - name: Verify Electron ABI compatibility
        run: npm run check:native

  # ──────────────────────────────────────────────────────────────────
  # BUILD VALIDATION - Verify production build (Vite frontend)
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build Production (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test-node, test-electron]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Build client (Vite)
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Verify build output exists
        run: |
          test -f dist/index.html
          test -f dist/assets/index-*.js
          test -f dist/assets/index-*.css
          echo "✅ Build output verified"

      - name: Verify source map integrity
        run: npm run verify:sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acai-wave-dist
          path: dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # ABI REGRESSION GUARD - Fail if ABI expectations drift
  # ──────────────────────────────────────────────────────────────────
  abi-guard:
    name: ABI Regression Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Check Electron version in package.json
        run: |
          ELECTRON_PKG=$(cat package.json | jq -r '.devDependencies.electron')
          ELECTRON_PKG_CLEAN=${ELECTRON_PKG#[\\^~>=<]*}
          echo "Electron version in package.json: $ELECTRON_PKG (clean: $ELECTRON_PKG_CLEAN)"
          if [[ "$ELECTRON_PKG_CLEAN" != "${{ env.ELECTRON_VERSION }}" ]]; then
            echo "⚠️  Electron version mismatch! Expected ${{ env.ELECTRON_VERSION }}, got $ELECTRON_PKG_CLEAN"
            echo "Update .github/workflows/ci.yml ELECTRON_VERSION env var if intentional"
            exit 1
          fi

      - name: Check .npmrc exists with electron config
        run: |
          if [[ ! -f .npmrc ]]; then
            echo "❌ .npmrc missing! Required for ABI consistency"
            exit 1
          fi
          if ! grep -q "disturl=https://electronjs.org/headers" .npmrc; then
            echo "❌ .npmrc missing Electron disturl!"
            exit 1
          fi
          echo "✅ .npmrc validated"

      - name: Verify dual-ABI installer exists
        run: |
          if [[ ! -f scripts/install-sqlite-bindings.cjs ]]; then
            echo "❌ scripts/install-sqlite-bindings.cjs missing!"
            exit 1
          fi
          if [[ ! -f database/db-binding.cjs ]]; then
            echo "❌ database/db-binding.cjs missing!"
            exit 1
          fi
          echo "✅ Dual-ABI installer and runtime resolver present"

      - name: Verify check:native script works
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm run rebuild:native
          npm run check:native -- --skip-electron-test
          echo "✅ check:native passes"

      - name: Verify check:node script works
        run: |
          npm run rebuild:node
          npm run check:node
          echo "✅ check:node passes"

  # ──────────────────────────────────────────────────────────────────
  # SECURITY AUDIT
  # ──────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install native bindings
        run: npm run rebuild:node

      - name: Run npm audit (fail on critical only)
        run: |
          npm audit --audit-level=critical --json --production --omit=dev > npm-audit-report.json 2>/dev/null
          CRITICAL_COUNT=$(jq '.vulnerabilities | to_entries | map(select(.value.severity == "critical")) | length' npm-audit-report.json 2>/dev/null || echo "0")
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ $CRITICAL_COUNT critical vulnerabilities found:"
            jq -r '.vulnerabilities | to_entries[] | select(.value.severity == "critical") | "  - \(.key): \(.value.description // "no description")"' npm-audit-report.json 2>/dev/null
            echo ""
            echo "📝 Run 'npm audit' locally to see full report."
            exit 1
          else
            echo "✅ No critical vulnerabilities found"
          fi

      - name: Cleanup audit artifact
        if: always()
        run: rm -f npm-audit-report.json

      - name: Run security tests
        run: npm test -- --run src/tests/security.test.js

      - name: Check for known vulnerable patterns in code
        run: |
          if grep -rn --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' 'eval(' src/ .github/ && ! grep -rn --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' 'eval(' src/ .github/ | grep -E '\.test\.(js|ts)|\.spec\.(js|ts)|mock|fixture'; then
            echo "❌ Found eval() usage - CSP violation risk"
            exit 1
          fi
          if grep -rn --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' 'new Function' src/ .github/ && ! grep -rn --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' 'new Function' src/ .github/ | grep -E '\.test\.(js|ts)|\.spec\.(js|ts)|mock|fixture'; then
            echo "❌ Found new Function() usage - CSP violation risk"
            exit 1
          fi
          if grep -rn "dangerouslySetInnerHTML" src/ --include="*.js" --include="*.jsx" --include="*.tsx" | grep -v node_modules | grep -v test; then
            echo "⚠️  Found dangerouslySetInnerHTML - verify sanitization"
          fi
          echo "✅ Security pattern check passed"

  # ──────────────────────────────────────────────────────────────────
  # DEPENDENCY REVIEW (PR only)
  # ──────────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  # ──────────────────────────────────────────────────────────────────
  # SUMMARY JOB
  # ──────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-and-typecheck, test-node, test-electron, build, abi-guard, security-audit, dependency-review]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          FAILED_JOBS=""
          TOTAL_JOBS=0

          check_result() {
            local job_name="$1"
            local job_result="$2"
            echo "| $job_name | $job_result |" >> $GITHUB_STEP_SUMMARY
            if [[ "$job_result" != "success" ]]; then
              FAILED_JOBS="$FAILED_JOBS  - $job_name ($job_result)"$'\n'
              TOTAL_JOBS=$((TOTAL_JOBS + 1))
            fi
          }

          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

          check_result "Lint & TypeCheck" "${{ needs.lint-and-typecheck.result }}"
          check_result "Tests (Node.js)" "${{ needs.test-node.result }}"
          check_result "Electron ABI Check (ABI 128)" "${{ needs.test-electron.result }}"
          check_result "Build Production (Vite)" "${{ needs.build.result }}"
          check_result "ABI Regression Guard" "${{ needs.abi-guard.result }}"
          check_result "Security Audit" "${{ needs.security-audit.result }}"

          # dependency-review só roda em PRs; 'skipped' é aceitável
          DEP_REVIEW="${{ needs.dependency-review.result }}"
          if [[ "$DEP_REVIEW" == "skipped" ]]; then
            echo "| Dependency Review | skipped (não é PR) |" >> $GITHUB_STEP_SUMMARY
          else
            check_result "Dependency Review" "$DEP_REVIEW"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -n "$FAILED_JOBS" ]]; then
            echo "### ❌ Failed Jobs" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo -e "$FAILED_JOBS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Pipeline result:** Failed ($TOTAL_JOBS job(s) failed)" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "### ✅ Pipeline result: All jobs passed" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
