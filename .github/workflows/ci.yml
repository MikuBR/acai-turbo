name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.gitattributes'
      - '.gitignore'
      - '.env.example'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitattributes'
      - '.gitignore'
      - '.env.example'

env:
  NODE_VERSION: 20
  # Impede publicação de secrets em logs
  ACTIONS_STEP_DEBUG: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: deps-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: deps-linux-
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npx eslint src/ database/

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: deps-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: deps-linux-
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npm audit --audit-level=high
        continue-on-error: true

  test:
    needs: [lint, audit]
    if: success()
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: deps-${{ matrix.os }}-node${{ env.NODE_VERSION }}-test-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ matrix.os }}-node${{ env.NODE_VERSION }}-
      - run: npm ci --ignore-scripts
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npm rebuild better-sqlite3
      - run: npm test
      - run: node scripts/smoke-test-db.cjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: frontend-build
          path: dist/
          retention-days: 1

  build-windows:
    if: github.event_name == 'push' && success()
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: deps-win-full-${{ hashFiles('package-lock.json') }}
          restore-keys: deps-win-
      - uses: microsoft/setup-msbuild@v2
      - name: Fix Python distutils
        run: pip install setuptools
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Package Electron installer
        run: npm run package:win

      - name: Validate installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release\*.exe
          if (-not $files) { throw "No .exe found in release/" }
          foreach ($f in $files) {
            $size = ($f.Length / 1MB).ToString("F2")
            Write-Host "✅ $($f.Name) — ${size}MB"
          }

      - name: Rebuild native addon before smoke test
        run: npm rebuild better-sqlite3

      - name: Smoke test DB migration
        shell: bash
        run: node scripts/smoke-test-db.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: acai-wave-installer
          path: release/

      - name: Calculate next CI version
        id: version
        shell: bash
        run: |
          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.0"
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_tag=v${NEXT_VERSION}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.next_tag }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.next_tag }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          files: release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
