name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        id: cache-lint
        with:
          path: node_modules
          key: deps-linux-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.cache-lint.outputs.cache-hit != 'true'
      - run: npx eslint src/ database/

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        id: cache-test
        with:
          path: node_modules
          key: deps-${{ matrix.os }}-test-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.cache-test.outputs.cache-hit != 'true' && matrix.os != 'windows-2022'
      - run: npm ci --ignore-scripts
        if: steps.cache-test.outputs.cache-hit != 'true' && matrix.os == 'windows-2022'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: frontend-build
          path: dist/
          retention-days: 1

  build-windows:
    if: github.event_name == 'push'
    needs: [lint, test]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        id: cache-build
        with:
          path: node_modules
          key: deps-win-full-${{ hashFiles('package-lock.json') }}

      - uses: microsoft/setup-msbuild@v2

      - name: Fix Python distutils
        run: pip install setuptools

      - run: npm ci
        if: steps.cache-build.outputs.cache-hit != 'true'

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Package Electron installer
        run: npm run package:win

      - uses: actions/upload-artifact@v4
        with:
          name: acai-wave-installer
          path: release/

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
