name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.gitattributes'
      - '.gitignore'
      - '.env.example'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitattributes'
      - '.gitignore'
      - '.env.example'

env:
  NODE_VERSION: 20
  # Impede publicação de secrets em logs
  ACTIONS_STEP_DEBUG: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: deps-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: deps-linux-
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npx eslint src/ database/

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: deps-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: deps-linux-
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npm audit --audit-level=high
        continue-on-error: true

  test:
    needs: [lint, audit]
    if: success()
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: deps-${{ matrix.os }}-test-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ matrix.os }}-
      - run: npm ci --ignore-scripts
        if: steps.cache.outputs.cache-hit != 'true'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: frontend-build
          path: dist/
          retention-days: 1

  build-windows:
    if: github.event_name == 'push' && success()
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: deps-win-full-${{ hashFiles('package-lock.json') }}
          restore-keys: deps-win-
      - uses: microsoft/setup-msbuild@v2
      - name: Fix Python distutils
        run: pip install setuptools
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Package Electron installer
        run: npm run package:win

      - name: Validate installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release\*.exe
          if (-not $files) { throw "No .exe found in release/" }
          foreach ($f in $files) {
            $size = ($f.Length / 1MB).ToString("F2")
            Write-Host "✅ $($f.Name) — ${size}MB"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: acai-wave-installer
          path: release/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-ci.{1}', '1.0.0', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build run {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
