name: CI - Açaí Wave

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  ELECTRON_VERSION: '32.0.0'

jobs:
  # ──────────────────────────────────────────────────────────────────
  # LINT & TYPECHECK
  # ──────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

  # ──────────────────────────────────────────────────────────────────
  # TESTS ON NODE.JS (ABI 127) - Vitest suite
  # ──────────────────────────────────────────────────────────────────
  test-node:
    name: Tests on Node.js (ABI 127)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Node.js
        run: npm run rebuild:node

      - name: Verify Node.js ABI compatibility
        run: npm run check:node

      - name: Run test suite
        run: npm test -- --reporter=verbose

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: node-tests
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────────
  # TESTS ON ELECTRON (ABI 119) - Electron integration
  # ──────────────────────────────────────────────────────────────────
  test-electron:
    name: Tests on Electron (ABI 119)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild:native

      - name: Verify Electron ABI compatibility
        run: npm run check:native

      - name: Verify Electron can start (smoke test)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run --auto-servernum timeout 30 npx electron -e "
            const { app } = require('electron');
            app.whenReady().then(() => {
              console.log('✅ Electron app initialized successfully');
              console.log('ABI:', process.versions.modules);
              console.log('Electron:', process.versions.electron);
              console.log('Node:', process.versions.node);
              app.exit(0);
            });
          " || true

      - name: Run database validation tests in Electron context
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run --auto-servernum npx electron -e "
            const { app } = require('electron');
            const path = require('path');
            app.whenReady().then(async () => {
              try {
                const db = require('better-sqlite3');
                const testDb = new db(':memory:');
                testDb.pragma('journal_mode = WAL');
                testDb.pragma('foreign_keys = ON');
                testDb.exec('CREATE TABLE test (id INTEGER PRIMARY KEY, name TEXT)');
                const stmt = testDb.prepare('INSERT INTO test (name) VALUES (?)');
                stmt.run('hello');
                const row = testDb.prepare('SELECT * FROM test').get();
                if (row.name !== 'hello') throw new Error('DB test failed');
                console.log('✅ better-sqlite3 works correctly in Electron');
                testDb.close();
                app.exit(0);
              } catch (e) {
                console.error('❌ Electron DB test failed:', e.message);
                app.exit(1);
              }
            });
          "

  # ──────────────────────────────────────────────────────────────────
  # BUILD VALIDATION - Verify production build works
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build Production
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-node, test-electron]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron (production target)
        run: npm run rebuild:native

      - name: Verify Electron ABI before build
        run: npm run check:native

      - name: Build client (Vite)
        run: npm run build

      - name: Verify build output exists
        run: |
          test -f dist/index.html
          test -f dist/assets/index-*.js
          test -f dist/assets/index-*.css
          echo "✅ Build output verified"

      - name: Build Windows installer (electron-builder)
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acai-wave-windows-installer
          path: release/*.exe
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # ABI REGRESSION GUARD - Fail if package-lock changes ABI expectations
  # ──────────────────────────────────────────────────────────────────
  abi-guard:
    name: ABI Regression Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Check Electron version in package.json
        run: |
          ELECTRON_PKG=$(cat package.json | jq -r '.devDependencies.electron')
          # Remove semver prefix (^, ~, >=, etc.) for comparison
          ELECTRON_PKG_CLEAN=${ELECTRON_PKG#[\^~>=<]*}
          echo "Electron version in package.json: $ELECTRON_PKG (clean: $ELECTRON_PKG_CLEAN)"
          if [[ "$ELECTRON_PKG_CLEAN" != "${{ env.ELECTRON_VERSION }}" ]]; then
            echo "⚠️  Electron version mismatch! Expected ${{ env.ELECTRON_VERSION }}, got $ELECTRON_PKG_CLEAN"
            echo "Update .github/workflows/ci.yml ELECTRON_VERSION env var if intentional"
            exit 1
          fi

      - name: Check .npmrc exists with electron config
        run: |
          if [[ ! -f .npmrc ]]; then
            echo "❌ .npmrc missing! Required for ABI consistency"
            exit 1
          fi
          if ! grep -q "runtime=electron" .npmrc; then
            echo "❌ .npmrc missing 'runtime=electron'"
            exit 1
          fi
          if ! grep -q "electron_version=${{ env.ELECTRON_VERSION }}" .npmrc; then
            echo "⚠️  .npmrc electron_version mismatch"
          fi
          echo "✅ .npmrc validated"

      - name: Verify swap-native-abi script exists
        run: |
          if [[ ! -f scripts/swap-native-abi.cjs ]]; then
            echo "❌ scripts/swap-native-abi.cjs missing!"
            exit 1
          fi
          echo "✅ ABI swap script present"

      - name: Verify check:native script works
        run: |
          npm install --legacy-peer-deps
          npm run rebuild:native
          npm run check:native -- --skip-electron-test
          echo "✅ check:native passes"

      - name: Verify check:node script works
        run: |
          npm run rebuild:node
          npm run check:node
          echo "✅ check:node passes"

  # ──────────────────────────────────────────────────────────────────
  # SECURITY AUDIT
  # ──────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run npm audit (fail on critical only)
        run: npm audit --audit-level=critical || true

      - name: Run security tests
        run: npm test -- --run src/tests/security.test.js

      - name: Check for known vulnerable patterns in code
        run: |
          # Check for eval/Function constructor usage (CSP violations)
          if grep -r "eval(" src/ --include="*.js" --include="*.jsx" | grep -v node_modules | grep -v test; then
            echo "❌ Found eval() usage - CSP violation risk"
            exit 1
          fi
          if grep -r "new Function" src/ --include="*.js" --include="*.jsx" | grep -v node_modules | grep -v test; then
            echo "❌ Found new Function() usage - CSP violation risk"
            exit 1
          fi
          # Check for innerHTML dangerouslySetInnerHTML without sanitization
          if grep -r "dangerouslySetInnerHTML" src/ --include="*.js" --include="*.jsx" | grep -v node_modules | grep -v test; then
            echo "⚠️  Found dangerouslySetInnerHTML - verify sanitization"
          fi
          echo "✅ Security pattern check passed"

  # ──────────────────────────────────────────────────────────────────
  # DEPENDENCY REVIEW
  # ──────────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

# ──────────────────────────────────────────────────────────────────
# SUMMARY JOB
# ──────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-node, test-electron, build, abi-guard, security-audit]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & TypeCheck | ${{ needs.lint-and-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (Node.js ABI 127) | ${{ needs.test-node.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (Electron ABI 119) | ${{ needs.test-electron.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Production | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ABI Regression Guard | ${{ needs.abi-guard.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fail if any job failed
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test-node.result }}" != "success" ]] || \
             [[ "${{ needs.test-electron.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.abi-guard.result }}" != "success" ]] || \
             [[ "${{ needs.security-audit.result }}" != "success" ]]; then
            echo "❌ Some jobs failed"
            exit 1
          fi
          echo "✅ All jobs passed"