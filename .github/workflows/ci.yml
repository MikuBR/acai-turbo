name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src/ database/

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (with postinstall for native addons)
        run: npm ci
        if: matrix.os != 'windows-2022'

      - name: Install dependencies (skip native rebuild, tests don't need SQLite)
        run: npm ci --ignore-scripts
        if: matrix.os == 'windows-2022'

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  build-windows:
    if: github.event_name == 'push'
    needs: [lint, test]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup MSVC tools
        uses: microsoft/setup-msbuild@v2

      - name: Fix Python distutils (removed in Python 3.12)
        run: pip install setuptools

      - name: Install dependencies (rebuilds native for Electron)
        run: npm ci

      - name: Build Electron installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: acai-wave-installer
          path: release/
