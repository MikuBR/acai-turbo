name: Release - Build Windows Installer

# Dispara em pushes de main (e develop) e em tags v*.
# Cada branch gera seu próprio installer e o publica numa release pré-lançada
# com tag windows-installer-<branch> (ex.: windows-installer-main), sobrescrita
# a cada push. Tags v* criam releases versionadas com o installer correspondente.
#
# Nota: a workflow release-on-success.yml (workflow_run) cuida apenas da
# release de texto edge-main. Este arquivo é o responsável pelo build do
# executável Windows e pela anexação do .exe à release.

on:
  push:
    tags:
      - 'v*'
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # needed for creating releases

env:
  NODE_VERSION: '22'
  ELECTRON_VERSION: '32.3.3'

jobs:
  build-windows:
    name: Build Windows Installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GATE: só publica se o CI (lint, testes, ABI, build) passou para este
      # mesmo commit. Evita publicar um installer a partir de código quebrado.
      # Em tags/dispatch manuais pode ser ignorado via SKIP_CI_GATE=true.
      - name: Verify CI passed for this commit
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:SKIP_CI_GATE -eq 'true') {
            Write-Host "SKIP_CI_GATE=true — pulando verificação do CI"
            exit 0
          }
          $sha = "${{ github.sha }}"
          Write-Host "Verificando conclusão do CI para $sha..."
          $result = gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha" --jq '.workflow_runs[0].conclusion // "none"' 2>$null
          Write-Host "CI conclusion: $result"
          if ($result -ne 'success') {
            Write-Error "CI não passou para este commit (conclusion=$result). Abortando o build do installer."
            exit 1
          }
          Write-Host "✅ CI passou — prosseguindo com o build"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup MSBuild (for native modules)
        uses: microsoft/setup-msbuild@v2

      # Note: postinstall script runs electron-builder install-app-deps +
      # the dual-ABI installer automatically. Using --ignore-scripts here to
      # avoid the postinstall rebuild before we install MSBuild (it would fail).
      # The rebuild is run explicitly below after MSBuild is available.
      - name: Install dependencies (pre-scripts)
        run: npm ci --legacy-peer-deps --ignore-scripts
        shell: pwsh

      - name: Rebuild native modules for Electron
        run: npm run rebuild:native
        shell: pwsh

      - name: Verify Electron ABI compatibility
        run: npm run check:native
        shell: pwsh

      - name: Build client (Vite)
        shell: pwsh
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Verify source map integrity
        shell: pwsh
        run: npm run verify:sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Build Windows installer (electron-builder)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          Write-Host "Building Windows installer..."
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Build assets directory contents:"
          Get-ChildItem build/
          $env:DEBUG = "electron-builder"
          try {
            npx electron-builder --win --x64 --publish never
            Write-Host "Build completed successfully"
          } catch {
            Write-Host "Build FAILED with error: $_"
            Write-Host "Error details: $($_.Exception.Message)"
            throw $_
          }
          Write-Host "Release directory contents after build:"
          if (Test-Path release) { Get-ChildItem release } else { Write-Host "release/ does not exist" }

      - name: Verify installer was created
        shell: pwsh
        run: |
          $files = Get-ChildItem release/*.exe -ErrorAction SilentlyContinue
          if (-not $files -or $files.Count -eq 0) {
            Write-Error "No .exe files found in release/"
            exit 1
          }
          foreach ($file in $files) {
            Write-Host "Found: $($file.Name) ($($file.Length) bytes)"
          }

      - name: Determinar tag do release
        id: refinfo
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            echo "TAG=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
            echo "REF_TYPE=tag" >> $env:GITHUB_OUTPUT
          } else {
            # branch push: usa release fixa por branch
            $safeRef = "$env:GITHUB_REF_NAME".Replace('/', '-')
            echo "TAG=windows-installer-$safeRef" >> $env:GITHUB_OUTPUT
            echo "REF_TYPE=branch" >> $env:GITHUB_OUTPUT
          }

      - name: Gerar release notes (commits desde última tag)
        id: release_notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ steps.refinfo.outputs.REF_TYPE }}
          TAG: ${{ steps.refinfo.outputs.TAG }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            # Primeira tag (não há tag anterior)
            $prevTag = git describe --tags --abbrev=0 HEAD~1 2>$null
            if (-not $prevTag) {
              # Primeira tag já criada: usa apenas o commit atual como release notes
              $notes = "Release $env:TAG`n`nPrimeira release versionada."
            } else {
              $notes = git log --no-merges --oneline "$prevTag..HEAD" 2>$null
              if (-not $notes) { $notes = "Release $env:TAG" }
            }
          } else {
            $lastTag = git describe --tags --abbrev=0 2>$null
            if ($lastTag) {
              $notes = git log --no-merges --oneline "$lastTag..HEAD" 2>$null
            } else {
              $notes = git log --no-merges --oneline -20 2>$null
            }
            if (-not $notes) { $notes = "Automated Windows installer build from $env:GITHUB_REF" }
          }
          echo "NOTES<<EOF" >> $env:GITHUB_OUTPUT
          echo $notes >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Determinar prerelease flag
        id: prerelease_flag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $isPre = $env:GITHUB_REF_NAME.Contains('-')
            echo "is_prerelease=$isPre" >> $env:GITHUB_OUTPUT
          } else {
            echo "is_prerelease=true" >> $env:GITHUB_OUTPUT
          }

      - name: Garantir que a release da branch existe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.refinfo.outputs.TAG }}"
          if (-not (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null)) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Açaí Wave $tag" --notes "Windows installer for $env:GITHUB_REF" --prerelease
          }

      - name: Criar/atualizar GitHub Release com o installer
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release/*.exe
            release/latest.yml
          tag_name: ${{ steps.refinfo.outputs.TAG }}
          name: "Açaí Wave ${{ steps.refinfo.outputs.TAG }}"
          body: |
            ## Açaí Wave ${{ steps.refinfo.outputs.TAG }}

            ### 📥 Download
            - **Windows Installer (NSIS):** `acai-wave Setup ${{ steps.refinfo.outputs.TAG }}.exe`

            ### 🔧 Changes
            ${{ steps.release_notes.outputs.notes }}

            ### 📦 Installation
            1. Download the `.exe` above
            2. Run the installer
            3. Launch Açaí Wave from Start Menu

            ---
            *Built from commit ${{ github.sha }}*
            *Trigger: ${{ github.ref_type }} ${{ github.ref }}*
          draft: false
          prerelease: ${{ steps.prerelease_flag.outputs.is_prerelease }}
          overwrite_files: true
