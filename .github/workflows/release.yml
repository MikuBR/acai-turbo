name: Release - Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  ELECTRON_VERSION: '32.3.3'

jobs:
  build-windows:
    name: Build Windows Installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild:native

      - name: Verify Electron ABI compatibility
        run: npm run check:native

      - name: Build client (Vite)
        run: npm run build

      - name: Verify build output
        run: |
          if (Test-Path dist/index.html) { Write-Host "✅ Build output verified" } else { exit 1 }

      - name: Build Windows installer (electron-builder)
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Açaí Wave ${{ steps.version.outputs.VERSION }}
          body: |
            ## Açaí Wave ${{ steps.version.outputs.VERSION }}
            
            ### Instalação
            1. Baixe `acai-wave Setup ${{ steps.version.outputs.VERSION }}.exe`
            2. Execute o instalador
            3. Siga o assistente de instalação
            
            ### Notas
            - Electron ${{ env.ELECTRON_VERSION }}
            - Node.js ${{ env.NODE_VERSION }}
            - ABI 128 (Electron) / 127 (Node.js)
          files: |
            release/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: acai-wave-windows-installer
          path: release/*.exe
          retention-days: 30