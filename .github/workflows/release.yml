name: Release - Build Windows Installer

# Dispara em pushes de main (e develop) e em tags v*.
# Todo push de main gera o EXE e o publica no release
# windows-installer-main (pre-release, sobrescrito a cada push).
# Tags v* criam releases versionadas com o installer correspondente.
#
# Nota: a workflow release-on-success.yml (workflow_run) cuida apenas da
# release de texto edge-main. Este arquivo é o responsável pelo build do
# executável Windows e pela anexação do .exe à release.

on:
  push:
    tags:
      - 'v*'
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # needed for creating releases

env:
  NODE_VERSION: '24'
  ELECTRON_VERSION: '32.3.3'

jobs:
  build-windows:
    name: Build Windows Installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: '24'
      ELECTRON_VERSION: '32.3.3'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup MSBuild (for native modules)
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        shell: pwsh

      - name: Rebuild native modules for Electron
        run: npm run rebuild:native
        shell: pwsh

      - name: Verify Electron ABI compatibility
        run: npm run check:native
        shell: pwsh

      - name: Build client (Vite)
        run: npm run build
        shell: pwsh

      - name: Verify build output exists
        run: |
          Test-Path dist/index.html
          Test-Path dist/assets/index-*.js
          Test-Path dist/assets/index-*.css
          Write-Host "✅ Build output verified"
        shell: pwsh

      - name: Build Windows installer (electron-builder)
        run: |
          Write-Host "Building Windows installer..."
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Release directory contents before build:"
          if (Test-Path release) { Get-ChildItem release } else { Write-Host "release/ does not exist" }
          Write-Host "Build assets directory contents:"
          Get-ChildItem build/
          $env:DEBUG = "electron-builder"
          try {
            npx electron-builder --win --x64 --publish never
            Write-Host "Build completed successfully"
          } catch {
            Write-Host "Build FAILED with error: $_"
            Write-Host "Error details: $($_.Exception.Message)"
            throw $_
          }
          Write-Host "Release directory contents after build:"
          if (Test-Path release) { Get-ChildItem release } else { Write-Host "release/ does not exist" }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: pwsh

      - name: Verify installer was created
        run: |
          $files = Get-ChildItem release/*.exe
          if ($files.Count -eq 0) {
            Write-Error "No .exe files found in release/"
            exit 1
          }
          foreach ($file in $files) {
            Write-Host "Found: $($file.Name) ($($file.Length) bytes)"
          }
        shell: pwsh

      - name: Determinar tag do release
        id: refinfo
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            echo "TAG=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
            echo "REF_TYPE=tag" >> $env:GITHUB_OUTPUT
          } else {
            # branch push: usa release fixa por branch
            $safeRef = "$env:GITHUB_REF_NAME".Replace('/', '-')
            echo "TAG=windows-installer-$safeRef" >> $env:GITHUB_OUTPUT
            echo "REF_TYPE=branch" >> $env:GITHUB_OUTPUT
          }

      - name: Gerar release notes (commits desde última tag)
        id: release_notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $fromTag = git describe --tags --abbrev=0 HEAD~1 2>$null
            if (-not $fromTag) { $fromTag = git rev-list --max-parents=0 HEAD }
            $notes = git log --no-merges --oneline "$fromTag..HEAD" 2>$null
            if (-not $notes) { $notes = "Release $env:TAG" }
          } else {
            $lastTag = git describe --tags --abbrev=0 2>$null
            if ($lastTag) {
              $notes = git log --no-merges --oneline "$lastTag..HEAD" 2>$null
            } else {
              $notes = git log --no-merges --oneline -20 2>$null
            }
            if (-not $notes) { $notes = "Automated Windows installer build from $env:GITHUB_REF" }
          }
          echo "NOTES<<EOF" >> $env:GITHUB_OUTPUT
          echo $notes >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Determinar prerelease flag
        id: prerelease_flag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $isPre = $env:GITHUB_REF_NAME.Contains('-')
            echo "is_prerelease=$isPre" >> $env:GITHUB_OUTPUT
          } else {
            echo "is_prerelease=true" >> $env:GITHUB_OUTPUT
          }

      - name: Garantir que a release da branch existe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.refinfo.outputs.TAG }}"
          if (-not (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null)) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Açaí Wave $tag" --notes "Windows installer for $env:GITHUB_REF" --prerelease
          }

      - name: Criar/atualizar GitHub Release com o installer
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release/*.exe
          tag_name: ${{ steps.refinfo.outputs.TAG }}
          name: "Açaí Wave ${{ steps.refinfo.outputs.TAG }}"
          body: |
            ## Açaí Wave ${{ steps.refinfo.outputs.TAG }}

            ### 📥 Download
            - **Windows Installer (NSIS):** `acai-wave Setup ${{ steps.refinfo.outputs.TAG }}.exe`

            ### 🔧 Changes
            ${{ steps.release_notes.outputs.notes }}

            ### 📦 Installation
            1. Download the `.exe` above
            2. Run the installer
            3. Launch Açaí Wave from Start Menu

            ---
            *Built from commit ${{ github.sha }}*
            *Trigger: ${{ github.ref_type }} ${{ github.ref }}*
          draft: false
          prerelease: ${{ steps.prerelease_flag.outputs.is_prerelease }}
          overwrite_files: true

