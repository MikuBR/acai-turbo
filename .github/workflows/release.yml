name: Release - Build Windows Installer

# Build do instalador Windows (NSIS) e publicação da release.
#
# GATILHO: workflow_run — dispara quando o "CI - Açaí Wave" TERMINA.
#
# Por que workflow_run e não push? O gate anterior lia a conclusão do CI no
# mesmo instante em que o push acontecia, quando a run do CI ainda estava
# `in_progress`. O campo `conclusion` é null nesse estado e o fallback
# `// "none"` transformava "ainda rodando" em "não passou": o job abortava
# ~68s ANTES de o CI terminar com sucesso. Era falso positivo — o CI passava e
# o build do instalador nunca rodava. Com workflow_run o CI já concluiu antes
# de este job existir, então a corrida desaparece por construção.
#
# Tags v*: o ci.yml não roda em push de tag (só em branches), então a release
# versionada é decidida por SHA. O passo "Detectar tag v* para este commit"
# compara o SHA aprovado pelo CI contra as tags v* do repo. Exige que a tag já
# esteja no remote quando o CI terminar — ordem recomendada: push de main e
# tag juntos (ver scripts/bump-version.cjs).
#
# Despacho manual continua disponível via workflow_dispatch.

on:
  workflow_run:
    workflows: ["CI - Açaí Wave"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:

# Cancela o job anterior se um novo CI do mesmo commit/branch terminar.
concurrency:
  group: build-windows-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write  # needed for creating releases

env:
  NODE_VERSION: '22'
  ELECTRON_VERSION: '32.3.3'

jobs:
  build-windows:
    name: Build Windows Installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 30

    # O instalador só é gerado quando o CI passou. Se o CI falhou ou foi
    # cancelado, o job inteiro é pulado — nunca publicamos a partir de código
    # quebrado. (No gatilho por push esse gate era um passo; aqui é o job.)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # SHA e branch do commit que o CI acabou de aprovar.
      # Em workflow_dispatch (manual) não há workflow_run; usa o HEAD local.
      - name: Resolver SHA e branch de origem
        id: src
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $sha = "${{ github.sha }}"
            $branch = "${{ github.ref_name }}"
            Write-Host "Modo manual (workflow_dispatch) — SHA=$sha branch=$branch"
          } else {
            $sha = "${{ github.event.workflow_run.head_sha }}"
            $branch = "${{ github.event.workflow_run.head_branch }}"
            Write-Host "CI concluído (${{ github.event.workflow_run.conclusion }}) — SHA=$sha branch=$branch"
          }
          echo "SHA=$sha" >> $env:GITHUB_OUTPUT
          echo "BRANCH=$branch" >> $env:GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 mantém o histórico completo e todas as tags
          # disponíveis para a detecção de tag v* por SHA no passo seguinte.
          fetch-depth: 0
          ref: ${{ steps.src.outputs.SHA }}

      # Decide o destino da release: tag v* existente para este commit, ou a
      # release contínua da branch (windows-installer-<branch>).
      #
      # O checkout acima (fetch-depth: 0) já traz as tags do remote. Resolve o
      # commit de cada tag v* com `git rev-list -n1`, que descasca tags
      # annotated (a tag aponta para um objeto tag, não para o commit — é o
      # mesmo motivo pelo qual `git/ref/tags/<t>` não serve para comparar SHA).
      # Sem chamadas de API: funciona mesmo que existam mais de 100 tags.
      - name: Detectar tag v* para este commit
        id: taginfo
        shell: pwsh
        env:
          SHA: ${{ steps.src.outputs.SHA }}
          BRANCH: ${{ steps.src.outputs.BRANCH }}
        run: |
          $sha = $env:SHA
          $matched = $null
          foreach ($t in (git tag -l)) {
            if ($t -notmatch '^v\d+\.\d+\.\d+') { continue }
            $target = (git rev-list -n1 $t 2>$null)
            if ($target -and $target -eq $sha) { $matched = $t; break }
          }

          if ($matched) {
            Write-Host "Tag versionada detectada: $matched (aponta para $sha)"
            echo "TAG=$matched" >> $env:GITHUB_OUTPUT
            echo "REF_TYPE=tag" >> $env:GITHUB_OUTPUT
            echo "PRERELEASE=false" >> $env:GITHUB_OUTPUT
          } else {
            $safeRef = ($env:BRANCH).Replace('/', '-')
            Write-Host "Sem tag v* para este commit — usando release da branch: windows-installer-$safeRef"
            echo "TAG=windows-installer-$safeRef" >> $env:GITHUB_OUTPUT
            echo "REF_TYPE=branch" >> $env:GITHUB_OUTPUT
            echo "PRERELEASE=true" >> $env:GITHUB_OUTPUT
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup MSBuild (for native modules)
        uses: microsoft/setup-msbuild@v2

      # Note: postinstall script runs electron-builder install-app-deps +
      # the dual-ABI installer automatically. Using --ignore-scripts here to
      # avoid the postinstall rebuild before we install MSBuild (it would fail).
      # The rebuild is run explicitly below after MSBuild is available.
      - name: Install dependencies (pre-scripts)
        run: npm ci --legacy-peer-deps --ignore-scripts
        shell: pwsh

      - name: Rebuild native modules for Electron
        run: npm run rebuild:native
        shell: pwsh

      - name: Verify Electron ABI compatibility
        run: npm run check:native
        shell: pwsh

      - name: Build client (Vite)
        shell: pwsh
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_APP_VERSION: ${{ steps.taginfo.outputs.TAG }}

      - name: Verify source map integrity
        shell: pwsh
        run: npm run verify:sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_APP_VERSION: ${{ steps.taginfo.outputs.TAG }}

      - name: Build Windows installer (electron-builder)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          Write-Host "Building Windows installer..."
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Build assets directory contents:"
          Get-ChildItem build/
          $env:DEBUG = "electron-builder"
          try {
            npx electron-builder --win --x64 --publish never
            Write-Host "Build completed successfully"
          } catch {
            Write-Host "Build FAILED with error: $_"
            Write-Host "Error details: $($_.Exception.Message)"
            throw $_
          }
          Write-Host "Release directory contents after build:"
          if (Test-Path release) { Get-ChildItem release } else { Write-Host "release/ does not exist" }

      - name: Verify installer was created
        shell: pwsh
        run: |
          $files = Get-ChildItem release/*.exe -ErrorAction SilentlyContinue
          if (-not $files -or $files.Count -eq 0) {
            Write-Error "No .exe files found in release/"
            exit 1
          }
          foreach ($file in $files) {
            Write-Host "Found: $($file.Name) ($($file.Length) bytes)"
          }

      - name: Gerar release notes (commits desde última tag)
        id: release_notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ steps.taginfo.outputs.REF_TYPE }}
          TAG: ${{ steps.taginfo.outputs.TAG }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            # Primeira tag (não há tag anterior)
            $prevTag = git describe --tags --abbrev=0 HEAD~1 2>$null
            if (-not $prevTag) {
              # Primeira tag já criada: usa apenas o commit atual como release notes
              $notes = "Release $env:TAG`n`nPrimeira release versionada."
            } else {
              $notes = git log --no-merges --oneline "$prevTag..HEAD" 2>$null
              if (-not $notes) { $notes = "Release $env:TAG" }
            }
          } else {
            $lastTag = git describe --tags --abbrev=0 2>$null
            if ($lastTag) {
              $notes = git log --no-merges --oneline "$lastTag..HEAD" 2>$null
            } else {
              $notes = git log --no-merges --oneline -20 2>$null
            }
            if (-not $notes) { $notes = "Automated Windows installer build from $env:GITHUB_REF" }
          }
          echo "NOTES<<EOF" >> $env:GITHUB_OUTPUT
          echo $notes >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Garantir que a release existe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.taginfo.outputs.TAG }}"
          if (-not (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null)) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Açaí Wave $tag" --notes "Windows installer for $env:GITHUB_REF" --prerelease --latest=false
          }

      - name: Criar/atualizar GitHub Release com o installer
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release/*.exe
            release/latest.yml
          tag_name: ${{ steps.taginfo.outputs.TAG }}
          name: "Açaí Wave ${{ steps.taginfo.outputs.TAG }}"
          body: |
            ## Açaí Wave ${{ steps.taginfo.outputs.TAG }}

            ### 📥 Download
            - **Windows Installer (NSIS):** `acai-wave Setup ${{ steps.taginfo.outputs.TAG }}.exe`

            ### 🔧 Changes
            ${{ steps.release_notes.outputs.notes }}

            ### 📦 Installation
            1. Download the `.exe` above
            2. Run the installer
            3. Launch Açaí Wave from Start Menu

            ---
            *Built from commit ${{ steps.src.outputs.SHA }}*
            *Trigger: ${{ github.event_name }} ${{ github.event.workflow_run.head_branch || github.ref_name }}*
          draft: false
          prerelease: ${{ steps.taginfo.outputs.PRERELEASE }}
          overwrite_files: true
          make_latest: ${{ steps.taginfo.outputs.REF_TYPE == 'tag' }}
