name: Release on CI Success

# Gera uma Release na aba "Releases" do GitHub automaticamente quando o CI
# passa em pushes de main. Cada push de main cria uma release distinta
# (tag edge-<sha-short>, marcada como pre-release) com changelog gerado pelo
# diff de commits desde a última release/edge ou última tag git.
#
# Não interfere no release.yml existente (que cria releases de installer
# Windows a partir de tags v* via workflow_dispatch/tags).

on:
  workflow_run:
    workflows: ["CI - Açaí Wave"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-on-success-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository (head commit do CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Configurações do Node (para acessar package.json)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Ler versão do package.json
        id: pkgversion
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Versão do package.json: $version"

      - name: Determinar referência da última release/edge
        id: lastref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"

          # Última release oficial (não pre-release)
          last_official=$(gh release list --limit 1 --json tagName,prerelease --jq 'map(select(.prerelease == false)) | .[0].tagName' 2>/dev/null || true)
          if [[ -z "$last_official" ]]; then
            last_official=$(git describe --tags --abbrev=0 2>/dev/null || true)
          fi

          # Última release edge existente (para sobreposição)
          last_edge=""
          if gh release view edge-main --repo "${{ github.repository }}" &>/dev/null; then
            last_edge=$(gh release view edge-main --repo "${{ github.repository }}" --json tagName --jq '.tagName')
          fi

          echo "last_official=$last_official"
          echo "last_edge=$last_edge"
          echo "commit_sha=$COMMIT_SHA"
          echo "last_official=$last_official" >> $GITHUB_OUTPUT
          echo "last_edge=$last_edge" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Gerar changelog (commits desde última referência)
        id: changelog
        env:
          LAST_OFFICIAL: ${{ steps.lastref.outputs.last_official }}
          LAST_EDGE: ${{ steps.lastref.outputs.last_edge }}
          COMMIT_SHA: ${{ steps.lastref.outputs.commit_sha }}
        run: |
          set -euo pipefail

          # Range de commits: entre última referência e o commit que disparou o CI
          if [[ -n "$LAST_EDGE" && "$LAST_EDGE" != "$COMMIT_SHA" ]]; then
            range="$LAST_EDGE..$COMMIT_SHA"
          elif [[ -n "$LAST_OFFICIAL" && "$LAST_OFFICIAL" != "$COMMIT_SHA" ]]; then
            range="$LAST_OFFICIAL..$COMMIT_SHA"
          else
            # Primeira release ou commit já corresponde à última tag
            range=""
          fi

          echo "Changelog range: $range"

          if [[ -n "$range" ]]; then
            commits=$(git log --no-merges --pretty=format:"- %h %s" "$range" 2>/dev/null || echo "- (sem commits novos)")
          else
            commits=$(git log --no-merges --pretty=format:"- %h %s" -20 2>/dev/null || echo "- (sem histórico)")
          fi

          echo "## Mudanças desde a última release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "$commits" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "commits<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "$commits" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Diff resumido dos arquivos modificados
          if [[ -n "$range" ]]; then
            files=$(git diff --stat --name-only "$range" 2>/dev/null || echo "")
            if [[ -n "$files" ]]; then
              echo "## Arquivos modificados" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              echo "$files" | head -50 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Criar/Atualizar release edge (main)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge-main
          name: "Açaí Wave Edge — main (${{ github.event.workflow_run.head_sha }})"
          body: |
            ## Release automática — push de main

            **Commit:** `${{ github.event.workflow_run.head_sha }}`
            **Disparado por:** @${{ github.actor }}
            **Versão do package.json:** `${{ steps.pkgversion.outputs.version }}`
            **Status CI:** sucesso ✅

            ---
            ${{ steps.changelog.outputs.commits }}
          draft: false
          prerelease: true
          allow_overwrite: true

      - name: Resumo final
        run: |
          echo "## ✅ Release automática criada/atualizada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** edge-main" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.event.workflow_run.head_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL:** https://github.com/${{ github.repository }}/releases/tag/edge-main" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release:** true (release contínua, não versão oficial)" >> $GITHUB_STEP_SUMMARY
